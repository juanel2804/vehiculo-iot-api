<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Excavadora de Juan</title>
<meta name="theme-color" content="#070a12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  :root { --fondo:#070a12; --vidrio:rgba(255,255,255,.06); --borde:rgba(255,255,255,.13); --texto:#eaf2ff; --suave:#8c9ab3;
          --cian:#3ee6ff; --violeta:#a78bfa; --rojo:#ff4d5e; --verde:#3dffa8; --ambar:#ffb547; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }
  html, body { margin:0; height:100%; overflow:hidden; color:var(--texto); font:15px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--fondo); }
  body { background:
      radial-gradient(60vw 60vh at 0% 0%, rgba(62,230,255,.16), transparent 60%),
      radial-gradient(60vw 60vh at 100% 100%, rgba(167,139,250,.18), transparent 60%), var(--fondo); }
  body::before { content:""; position:fixed; inset:0; pointer-events:none;
    background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
    background-size:32px 32px; }
  button { font:inherit; color:inherit; }
  .vidrio { background:var(--vidrio); border:1px solid var(--borde); border-radius:20px;
    backdrop-filter:blur(16px) saturate(140%); -webkit-backdrop-filter:blur(16px) saturate(140%);
    box-shadow:0 12px 40px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.08); }

  /* ---------- distribución: horizontal = gamepad ---------- */
  .consola { position:relative; height:100%; display:grid; gap:14px; align-items:center;
    grid-template-columns:1fr minmax(220px,300px) 1fr;
    padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left)); }
  .lado { display:flex; flex-direction:column; align-items:center; gap:10px; }
  .lado .titulo { font-size:11px; letter-spacing:3px; color:var(--suave); font-weight:700; }

  /* ---------- joystick ---------- */
  .stick { --t:min(40vh,30vw,260px); position:relative; width:var(--t); height:var(--t); border-radius:50%; touch-action:none;
    background:radial-gradient(circle at 50% 50%, rgba(62,230,255,.08), rgba(255,255,255,.03) 60%, rgba(255,255,255,.06));
    border:1px solid var(--borde); box-shadow:inset 0 0 40px rgba(0,0,0,.6), 0 0 0 6px rgba(255,255,255,.02); }
  .stick::before { content:""; position:absolute; inset:32%; border-radius:50%; border:1px dashed rgba(255,255,255,.18); }
  .stick .flecha { position:absolute; font-size:13px; font-weight:800; letter-spacing:1px; color:var(--suave); }
  .stick .flecha.on { color:var(--cian); text-shadow:0 0 12px var(--cian); }
  .f-ar { top:7%; left:50%; transform:translateX(-50%); } .f-ab { bottom:7%; left:50%; transform:translateX(-50%); }
  .f-iz { left:6%; top:50%; transform:translateY(-50%); } .f-de { right:6%; top:50%; transform:translateY(-50%); }
  .perilla { position:absolute; left:50%; top:50%; width:36%; height:36%; margin:-18% 0 0 -18%; border-radius:50%; pointer-events:none;
    background:radial-gradient(circle at 35% 30%, #ffffff, #9fe9ff 30%, #2aa7c7 70%, #0d4a5c);
    box-shadow:0 8px 24px rgba(0,0,0,.6), 0 0 22px rgba(62,230,255,.35); }
  .stick.activo { border-color:var(--cian); box-shadow:inset 0 0 40px rgba(0,0,0,.6), 0 0 30px rgba(62,230,255,.35); }

  /* ---------- centro ---------- */
  .centro { display:flex; flex-direction:column; gap:12px; align-items:stretch; }
  .estado { padding:12px 14px; text-align:center; }
  .leds { display:flex; justify-content:center; gap:6px; flex-wrap:wrap; }
  .led { display:inline-flex; align-items:center; gap:5px; font-size:11px; color:var(--suave); padding:3px 8px; border-radius:999px; border:1px solid var(--borde); }
  .led i { width:7px; height:7px; border-radius:50%; background:var(--suave); }
  .led.ok { color:var(--texto); } .led.ok i { background:var(--verde); box-shadow:0 0 8px var(--verde); }
  .led.mal i { background:var(--rojo); box-shadow:0 0 8px var(--rojo); }
  .cmd { font-size:24px; font-weight:900; letter-spacing:2px; margin:10px 0 2px; color:var(--rojo); text-shadow:0 0 16px rgba(255,77,94,.4); }
  .cmd.mueve { color:var(--cian); text-shadow:0 0 18px rgba(62,230,255,.55); }
  .sub { font-size:12px; color:var(--suave); }
  .stop { position:relative; align-self:center; width:min(26vh,140px); aspect-ratio:1; border-radius:50%; cursor:pointer; touch-action:manipulation;
    border:2px solid rgba(255,255,255,.3); background:radial-gradient(circle at 35% 30%, #ff8592, #ff4d5e 45%, #a1122c);
    font-weight:900; letter-spacing:3px; font-size:17px; color:#fff;
    box-shadow:0 0 0 8px rgba(255,77,94,.12), 0 14px 36px rgba(255,77,94,.45), inset 0 2px 0 rgba(255,255,255,.4); }
  .stop:active { transform:scale(.96); }
  .segmentos { display:flex; padding:3px; gap:3px; border-radius:12px; background:rgba(0,0,0,.3); border:1px solid var(--borde); }
  .segmentos button { flex:1; border:0; background:transparent; padding:7px 4px; border-radius:9px; color:var(--suave); font-size:13px; cursor:pointer; }
  .segmentos button[aria-pressed="true"] { color:var(--texto); font-weight:800; background:linear-gradient(135deg,rgba(62,230,255,.3),rgba(167,139,250,.3)); box-shadow:inset 0 0 0 1px rgba(62,230,255,.45); }
  .etq { font-size:10px; letter-spacing:2px; color:var(--suave); text-align:center; margin-bottom:4px; font-weight:700; }
  .esquina { position:absolute; top:max(10px,env(safe-area-inset-top)); right:max(12px,env(safe-area-inset-right)); display:flex; gap:8px; }
  .chico { border:1px solid var(--borde); background:var(--vidrio); border-radius:12px; padding:7px 10px; font-size:12px; cursor:pointer; }
  a.chico { color:var(--texto); text-decoration:none; }
  .panelLlave { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); z-index:5; width:min(90vw,340px); padding:16px;
    display:flex; flex-direction:column; gap:10px; background:rgba(12,16,28,.92); }
  .panelLlave[hidden] { display:none; }
  .panelLlave input { font:inherit; color:var(--texto); background:rgba(0,0,0,.35); border:1px solid var(--borde); border-radius:12px;
    padding:11px; user-select:text; -webkit-user-select:text; }
  .marca { position:absolute; top:max(10px,env(safe-area-inset-top)); left:max(14px,env(safe-area-inset-left)); font-weight:900; letter-spacing:3px; font-size:12px; }
  .marca span { color:var(--cian); }

  /* ---------- vertical: sticks abajo, uno junto al otro ---------- */
  @media (orientation: portrait) {
    .consola { grid-template-columns:1fr 1fr; grid-template-rows:auto 1fr auto; padding-top:max(52px,env(safe-area-inset-top)); }
    .centro { grid-column:1 / -1; grid-row:1; }
    .lado.izq { grid-column:1; grid-row:2; } .lado.der { grid-column:2; grid-row:2; }
    .stick { --t:min(44vw,34vh); }
    .stop { width:min(24vw,110px); }
  }
  .paro { position:fixed; inset:0; display:grid; place-items:center; background:rgba(255,77,94,.25); font-size:34px; font-weight:900; letter-spacing:6px; pointer-events:none; }
  .paro[hidden] { display:none; }
</style>
</head>
<body>
<div class="marca">EXCAVADORA <span>JUAN</span></div>
<div class="esquina">
  <a class="chico" id="btnMas" href="app.html" hidden>✨ IA · Gestos · Wi-Fi</a>
  <button class="chico" id="btnLlave" title="Llave de control" hidden>🔑</button>
  <button class="chico" id="btnPantalla" title="Pantalla completa">⛶</button>
</div>
<div class="panelLlave vidrio" id="panelLlave" hidden>
  <b>Llave de control</b>
  <input id="llave" type="password" placeholder="X-API-Key" autocomplete="off">
  <button class="chico" id="btnGuardarLlave">Conectar</button>
</div>

<div class="consola">
  <div class="lado izq">
    <div class="titulo">TRACCIÓN</div>
    <div class="stick" id="stickIzq">
      <span class="flecha f-ar" data-c="AVANZAR">▲</span><span class="flecha f-ab" data-c="RETROCEDER">▼</span>
      <span class="flecha f-iz" data-c="GIRO_IZQUIERDA">◀</span><span class="flecha f-de" data-c="GIRO_DERECHA">▶</span>
      <div class="perilla"></div>
    </div>
  </div>

  <div class="centro">
    <div class="vidrio estado">
      <div class="leds">
        <span class="led" id="ledEnlace"><i></i>Enlace</span>
        <span class="led" id="ledNube"><i></i>Nube</span>
        <span class="led" id="ledPing"><i></i>— ms</span>
      </div>
      <div class="cmd" id="cmd">DETENIDO</div>
      <div class="sub" id="sub">Toca = pulso · Mantén = continuo</div>
    </div>
    <button class="stop" id="btnStop">STOP</button>
    <div>
      <div class="etq">PULSO AL TOCAR</div>
      <div class="segmentos" id="segPulso"><button data-ms="200">0.2 s</button><button data-ms="500">0.5 s</button><button data-ms="1000">1 s</button></div>
    </div>
  </div>

  <div class="lado der">
    <div class="titulo">CABINA · PALA</div>
    <div class="stick" id="stickDer">
      <span class="flecha f-ar" data-c="PALA_ARRIBA">⤒</span><span class="flecha f-ab" data-c="PALA_ABAJO">⤓</span>
      <span class="flecha f-iz" data-c="ROTACION_IZQUIERDA">↺</span><span class="flecha f-de" data-c="ROTACION_DERECHA">↻</span>
      <div class="perilla"></div>
    </div>
  </div>
</div>
<div class="paro" id="paro" hidden>STOP</div>

<script>
/* Gamepad de la excavadora. Funciona en dos lugares con el mismo código:
   - NUBE (la sirve la EC2 en /control/…): WebSocket wss://<dominio>/ws/vehiculos/{id}; primero
     {"tipo":"auth","llave":…} y luego {"tipo":"control","c":"AVANZAR","ms":0}. El servidor lo
     reenvía al ESP32 al instante y guarda el historial en segundo plano.
   - LOCAL (la sirve el ESP32 en http://<IP>): WebSocket ws://<IP>:81 con {"c":…,"ms":…}, sin internet.
   ms = 0 → continuo (se renueva cada 250 ms; si deja de llegar, el ESP32 se detiene solo) · ms > 0 → pulso exacto. */
const $ = id => document.getElementById(id);
const NOMBRES = { AVANZAR:"AVANZANDO", RETROCEDER:"REVERSA", GIRO_IZQUIERDA:"GIRO ◀", GIRO_DERECHA:"GIRO ▶",
  ROTACION_IZQUIERDA:"CABINA ↺", ROTACION_DERECHA:"CABINA ↻", PALA_ARRIBA:"PALA ⤒", PALA_ABAJO:"PALA ⤓", DETENER:"DETENIDO" };
const RENOVAR_MS = 250;
const NUBE = location.pathname.startsWith("/control");
function leer(k, d) { try { return localStorage.getItem(k) ?? d; } catch { return d; } }
function guardar(k, v) { try { localStorage.setItem(k, v); } catch {} }
const vehiculo = Number(new URLSearchParams(location.search).get("v") || leer("iot_vehiculo", "1"));
let ws = null, pulso = Number(leer("pulso", "500")), ultimaTelemetria = 0, autorizado = !NUBE, finPulso = null;

function led(id, texto, estado) { const l = $(id); l.className = "led" + (estado ? " " + estado : ""); l.lastChild.textContent = texto; }
function vibrar(p) { if (navigator.vibrate) navigator.vibrate(p); }

function pintarComando(c, detalle, ms = 0) {
  clearTimeout(finPulso);
  $("cmd").textContent = NOMBRES[c] || c;
  $("cmd").classList.toggle("mueve", c !== "DETENER");
  if (detalle) $("sub").textContent = detalle;
  if (ms > 0 && c !== "DETENER") finPulso = setTimeout(() => pintarComando("DETENER"), ms);
}
function pintarTelemetria(t) {
  if (!t) return;
  ultimaTelemetria = Date.now();
  led("ledNube", "ESP32", "ok");
  $("sub").textContent = `ESP32 en línea · Wi-Fi ${t.rssi} dBm · ${t.ip}`;
}
function pedirLlave() { $("panelLlave").hidden = false; $("llave").value = leer("iot_api_key", ""); $("llave").focus(); }

/* ---------- enlace: nube (EC2) o local (ESP32) ---------- */
function conectar() {
  const url = NUBE ? `${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws/vehiculos/${vehiculo}`
                   : `ws://${location.hostname}:81/`;
  ws = new WebSocket(url);
  ws.onopen = () => {
    led("ledEnlace", NUBE ? "Servidor" : "Enlace", "ok");
    if (NUBE) {
      const llave = leer("iot_api_key", "");
      if (llave) ws.send(JSON.stringify({ tipo: "auth", llave })); else pedirLlave();
    }
  };
  ws.onclose = () => { led("ledEnlace", "Sin enlace", "mal"); soltarTodo(false); setTimeout(conectar, 1500); };
  ws.onmessage = e => {
    let m; try { m = JSON.parse(e.data); } catch { return; }
    if (!NUBE) {                                   // mensajes del ESP32 (control local)
      if (m.t === "pong") led("ledPing", `${Math.round(performance.now() - m.p)} ms`, "ok");
      if (m.t === "estado") {
        pintarComando(m.c, `${m.o || ""} · Wi-Fi ${m.rssi} dBm · ${m.ip}`);
        led("ledNube", m.nube ? "Nube" : "Sin nube", m.nube ? "ok" : "mal");
      }
      return;
    }
    switch (m.tipo) {                              // eventos del servidor (nube)
      case "pong": if (m.p != null) led("ledPing", `${Math.round(performance.now() - m.p)} ms`, "ok"); break;
      case "auth":
        autorizado = m.ok;
        if (!m.ok) { led("ledEnlace", "Llave inválida", "mal"); pedirLlave(); } else $("panelLlave").hidden = true;
        break;
      case "estado_inicial":
        if (m.estado) pintarComando(m.estado.comando || "DETENER");
        if (m.telemetria) pintarTelemetria(m.telemetria);
        break;
      case "control": pintarComando(m.comando, null, m.ms); break;
      case "movimiento": pintarComando(m.comando, m.origen); break;
      case "demo_movimiento": pintarComando(m.comando, `DEMO ${m.orden}/${m.total_movimientos}`, m.duracion_ms); break;
      case "telemetria": pintarTelemetria(m); break;
      case "error": $("sub").textContent = m.detalle || "Error"; break;
    }
  };
}
function mandar(c, ms) {
  if (!ws || ws.readyState !== 1) return;
  if (NUBE && !autorizado) return pedirLlave();
  ws.send(JSON.stringify(NUBE ? { tipo: "control", c, ms } : { c, ms }));
}
setInterval(() => {
  if (ws && ws.readyState === 1) ws.send(JSON.stringify(NUBE ? { tipo: "ping", p: performance.now() } : { p: performance.now() }));
  if (NUBE && Date.now() - ultimaTelemetria > 12000) led("ledNube", "ESP32 fuera", "mal");
}, 2000);

if (NUBE) {
  $("btnMas").hidden = false; $("btnLlave").hidden = false;
  $("btnLlave").addEventListener("click", pedirLlave);
  $("btnGuardarLlave").addEventListener("click", () => {
    const llave = $("llave").value.trim();
    guardar("iot_api_key", llave);
    if (ws && ws.readyState === 1) ws.send(JSON.stringify({ tipo: "auth", llave }));
  });
}

/* ---------- joysticks ---------- */
let dueño = null;   // solo un stick manda a la vez (la máquina hace un movimiento a la vez)
function crearStick(el) {
  const perilla = el.querySelector(".perilla");
  const mapa = {}; el.querySelectorAll(".flecha").forEach(f => mapa[[...f.classList].find(k => k.startsWith("f-"))] = f.dataset.c);
  const s = { id: null, dir: null, t0: 0, renovar: null };
  const marcar = d => el.querySelectorAll(".flecha").forEach(f => f.classList.toggle("on", f.dataset.c === d));

  function fijar(d) {
    if (d === s.dir) return;
    s.dir = d; marcar(d); clearInterval(s.renovar); s.renovar = null;
    if (d) { vibrar(12); mandar(d, 0); s.renovar = setInterval(() => mandar(s.dir, 0), RENOVAR_MS); }
    else mandar("DETENER", 0);
  }
  function mover(e) {
    const r = el.getBoundingClientRect(), R = r.width / 2;
    let dx = (e.clientX - (r.left + R)) / R, dy = (e.clientY - (r.top + R)) / R;
    const d = Math.hypot(dx, dy); if (d > 1) { dx /= d; dy /= d; }
    perilla.style.transform = `translate(${dx * R * .62}px, ${dy * R * .62}px)`;
    let nd = null;
    if (d > .35) nd = Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? mapa["f-iz"] : mapa["f-de"]) : (dy < 0 ? mapa["f-ar"] : mapa["f-ab"]);
    fijar(nd);
  }
  el.addEventListener("pointerdown", e => {
    if (s.id !== null || (dueño && dueño !== s)) return;
    e.preventDefault(); s.id = e.pointerId; dueño = s; el.setPointerCapture(s.id);
    s.t0 = performance.now(); el.classList.add("activo"); mover(e);
  });
  el.addEventListener("pointermove", e => { if (e.pointerId === s.id) mover(e); });
  const fin = e => {
    if (e.pointerId !== s.id) return;
    s.id = null; dueño = null; el.classList.remove("activo"); perilla.style.transform = "";
    clearInterval(s.renovar); s.renovar = null;
    const tenido = performance.now() - s.t0;
    // toque corto = pulso exacto (lo cronometra el ESP32); mantenido = alto al soltar
    if (s.dir) mandar(tenido < pulso ? s.dir : "DETENER", tenido < pulso ? Math.round(pulso - tenido) : 0);
    s.dir = null; marcar(null);
  };
  ["pointerup", "pointercancel", "lostpointercapture"].forEach(ev => el.addEventListener(ev, fin));
  s.soltar = () => { clearInterval(s.renovar); s.renovar = null; s.dir = null; s.id = null; marcar(null); el.classList.remove("activo"); perilla.style.transform = ""; };
  return s;
}
const sticks = [crearStick($("stickIzq")), crearStick($("stickDer"))];
function soltarTodo(enviar = true) { sticks.forEach(s => s.soltar()); dueño = null; teclas.clear(); clearInterval(renovarTecla); if (enviar) mandar("DETENER", 0); }

/* ---------- STOP, pulso, teclado, pantalla ---------- */
$("btnStop").addEventListener("click", () => { soltarTodo(); vibrar([30, 40, 30]); });

const botones = [...$("segPulso").querySelectorAll("button")];
const pintarPulso = () => botones.forEach(b => b.setAttribute("aria-pressed", String(Number(b.dataset.ms) === pulso)));
botones.forEach(b => b.addEventListener("click", () => { pulso = Number(b.dataset.ms); pintarPulso(); guardar("pulso", pulso); }));
pintarPulso();

const TECLAS = { w:"AVANZAR", arrowup:"AVANZAR", s:"RETROCEDER", arrowdown:"RETROCEDER", a:"GIRO_IZQUIERDA", arrowleft:"GIRO_IZQUIERDA",
  d:"GIRO_DERECHA", arrowright:"GIRO_DERECHA", q:"ROTACION_IZQUIERDA", e:"ROTACION_DERECHA", r:"PALA_ARRIBA", f:"PALA_ABAJO" };
const teclas = new Map(); let renovarTecla = null;
addEventListener("keydown", e => {
  if (e.target.matches("input")) return;
  if (e.key === " ") { e.preventDefault(); return soltarTodo(); }
  const c = TECLAS[e.key.toLowerCase()]; if (!c || e.repeat) return;
  teclas.set(c, performance.now()); mandar(c, 0);
  clearInterval(renovarTecla); renovarTecla = setInterval(() => mandar(c, 0), RENOVAR_MS);
});
addEventListener("keyup", e => {
  const c = TECLAS[e.key.toLowerCase()]; if (!c || !teclas.has(c)) return;
  const tenido = performance.now() - teclas.get(c); teclas.delete(c); clearInterval(renovarTecla);
  mandar(tenido < pulso ? c : "DETENER", tenido < pulso ? Math.round(pulso - tenido) : 0);
});

$("btnPantalla").addEventListener("click", async () => {
  try { await document.documentElement.requestFullscreen(); await screen.orientation.lock("landscape"); } catch {}
});
document.addEventListener("visibilitychange", () => { if (document.hidden) soltarTodo(); });

// Agitar el cel = paro de emergencia
let ultimoAgite = 0;
addEventListener("devicemotion", e => {
  const a = e.accelerationIncludingGravity; if (!a || a.x == null) return;
  if (Math.hypot(a.x, a.y, a.z) > 28 && performance.now() - ultimoAgite > 1500) {
    ultimoAgite = performance.now(); soltarTodo(); vibrar([200, 80, 200]);
    $("paro").hidden = false; setTimeout(() => $("paro").hidden = true, 800);
  }
});

conectar();
</script>
</body>
</html>
